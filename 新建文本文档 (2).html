<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST280G 保护装置 · Modbus 测试 + MQTT 远程</title>
    <!-- MQTT.js (国内 CDN) -->
    <script src="https://cdn.bootcdn.net/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:#f0f2f5; color:#1a1a2e; padding:20px; }
        .container { max-width:1500px; margin:0 auto; }
        h1 { font-size:24px; font-weight:600; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .subtitle { color:#666; font-size:14px; font-weight:400; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; background:#fff; padding:16px 24px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:20px; }
        .status-badge { display:flex; align-items:center; gap:8px; font-size:14px; }
        .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
        .status-dot.disconnected { background:#aaa; }
        .status-dot.connected { background:#2ecc71; }
        .status-dot.error { background:#e74c3c; }
        .status-dot.mqtt-connected { background:#3498db; }
        .grid-2col { display:grid; grid-template-columns:360px 1fr; gap:20px; }
        @media (max-width:900px) { .grid-2col { grid-template-columns:1fr; } }
        .card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:18px 20px; margin-bottom:16px; }
        .card-title { font-size:15px; font-weight:600; color:#1a1a2e; margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .card-title .badge { font-size:11px; font-weight:400; background:#eef2f7; color:#555; padding:0 10px; border-radius:20px; line-height:22px; }
        .form-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
        .form-row label { font-size:13px; color:#555; min-width:50px; }
        .form-row input, .form-row select { padding:6px 10px; border:1px solid #d0d7de; border-radius:6px; font-size:13px; background:#fafbfc; transition:border 0.2s; }
        .form-row input:focus, .form-row select:focus { border-color:#4a90d9; outline:none; background:#fff; }
        .form-row input[type="number"] { width:70px; }
        .form-row input[type="text"] { width:120px; }
        .btn { padding:7px 18px; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:#4a90d9; color:#fff; }
        .btn-primary:hover { background:#3a7bc8; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-success { background:#2ecc71; color:#fff; }
        .btn-success:hover { background:#27ae60; }
        .btn-danger { background:#e74c3c; color:#fff; }
        .btn-danger:hover { background:#c0392b; }
        .btn-warning { background:#f39c12; color:#fff; }
        .btn-warning:hover { background:#e67e22; }
        .btn-outline { background:transparent; color:#4a90d9; border:1px solid #4a90d9; }
        .btn-outline:hover { background:#4a90d9; color:#fff; }
        .btn-sm { padding:4px 12px; font-size:12px; }
        .btn-group { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
        .divider { border-top:1px solid #eaeef2; margin:14px 0; }
        .log-area { background:#0d1117; color:#e6edf3; font-family:'Cascadia Code','Consolas',monospace; font-size:12px; padding:12px 14px; border-radius:8px; max-height:420px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; line-height:1.6; min-height:200px; }
        .log-area .log-time { color:#8b949e; }
        .log-area .log-tx { color:#58a6ff; }
        .log-area .log-rx { color:#3fb950; }
        .log-area .log-info { color:#d2a8ff; }
        .log-area .log-warn { color:#d29922; }
        .log-area .log-err { color:#f85149; }
        .log-area .log-data { color:#f0883e; }
        .log-area .log-parse { color:#b392f0; font-size:11px; padding-left:20px; display:block; white-space:pre-wrap; word-break:break-all; }
        .parse-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 12px; font-size:13px; max-height:400px; overflow-y:auto; padding-right:4px; }
        .parse-item { display:flex; justify-content:space-between; padding:3px 6px; border-radius:4px; background:#f8f9fa; border-left:3px solid #4a90d9; align-items:center; }
        .parse-item .label { color:#555; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
        .parse-item .value { font-weight:500; color:#1a1a2e; white-space:nowrap; }
        .parse-item.yx-on { border-left-color:#2ecc71; }
        .parse-item.yx-off { border-left-color:#aaa; }
        .parse-item.yc { border-left-color:#f39c12; }
        .soe-item { background:#f0f4ff; padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:13px; border-left:3px solid #4a90d9; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px 12px; }
        .soe-item .time { color:#4a90d9; font-weight:500; }
        .soe-item .desc { color:#1a1a2e; }
        .soe-item .yx { color:#e67e22; }
        .soe-item .idx-badge { font-size:11px; background:#eef2f7; color:#888; padding:0 8px; border-radius:12px; }
        .empty-hint { color:#999; font-size:13px; padding:20px 0; text-align:center; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        .mt-8 { margin-top:8px; }
        .mb-8 { margin-bottom:8px; }
        .cmd-input { width:60px; font-family:monospace; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:999; }
        .modal-overlay.active { display:flex; }
        .modal-box { background:#fff; padding:24px; border-radius:12px; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
        .modal-box h3 { margin-bottom:12px; }
        .modal-box .name-row { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
        .modal-box .name-row input { flex:1; padding:4px 8px; border:1px solid #ccc; border-radius:4px; }
        .modal-box .name-row span { font-weight:500; width:60px; }
        .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:16px; }
        .auto-poll-group { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .auto-poll-group label { display:flex; align-items:center; gap:4px; }
        .auto-poll-group input[type="checkbox"] { width:16px; height:16px; }
        .soe-toolbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .soe-count { font-size:12px; color:#888; font-weight:400; margin-left:4px; }
        .soe-scroll { max-height:200px; overflow-y:auto; }
        .soe-scroll .empty-hint { padding:20px 0; }
        .soe-item .soe-actions { display:flex; gap:4px; }
        .soe-item .soe-actions button { background:none; border:none; color:#999; cursor:pointer; font-size:12px; padding:0 4px; }
        .soe-item .soe-actions button:hover { color:#e74c3c; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1a1a2e; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:1000; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        .toast.show { opacity:1; }
        .toast.success { background:#27ae60; }
        .toast.error { background:#e74c3c; }
        .toast.info { background:#4a90d9; }
        /* MQTT 面板样式 */
        .mqtt-panel { background:#e8f0fe; border-radius:8px; padding:12px; margin-top:8px; }
        .mqtt-panel .form-row { margin-bottom:4px; }
        .mqtt-status { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
        .mqtt-status.off { background:#aaa; }
        .mqtt-status.on { background:#3498db; }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶栏 -->
    <div class="top-bar">
        <div>
            <h1>⚡ ST280G 保护装置 · Modbus + MQTT <span class="subtitle">珠海思创 (远程可控)</span></h1>
        </div>
        <div class="status-badge">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText">未连接</span>
            <span style="margin-left:12px;font-size:13px;color:#888;" id="portInfo">—</span>
            <span style="margin-left:12px;font-size:13px;color:#888;" id="mqttStatus">MQTT: 未连接</span>
        </div>
    </div>

    <div class="grid-2col">
        <!-- 左栏 -->
        <div>
            <div class="card">
                <div class="card-title">📡 串口设置 <span class="badge">Web Serial API</span></div>
                <div class="form-row">
                    <label>波特率</label>
                    <select id="baudRate" style="width:100px;">
                        <option value="19200" selected>19200</option>
                        <option value="4800">4800</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                    </select>
                    <label style="margin-left:8px;">地址</label>
                    <input type="number" id="slaveAddr" value="1" min="1" max="247" style="width:60px;">
                    <label style="margin-left:8px;">时区</label>
                    <input type="number" id="timezoneOffset" value="8" min="-12" max="14" style="width:50px;">
                    <span style="font-size:12px;color:#888;">小时</span>
                </div>
                <div class="form-row">
                    <button class="btn btn-success" id="btnConnect">🔗 连接</button>
                    <button class="btn btn-danger" id="btnDisconnect" disabled>断开</button>
                    <label style="margin-left:8px;">超时</label>
                    <input type="number" id="timeoutMs" value="2000" min="500" step="100" style="width:70px;">
                    <span style="font-size:12px;color:#888;">ms</span>
                </div>
                <div class="form-row" style="margin-top:6px;">
                    <label>SOE起始</label>
                    <input type="text" id="soeStartAddr" value="0x03E8" style="width:80px;font-family:monospace;">
                    <span style="font-size:12px;color:#888;">(十六进制)</span>
                </div>
            </div>

            <!-- ===== MQTT 面板 ===== -->
            <div class="card">
                <div class="card-title">🌐 MQTT 远程 <span class="badge">中国区 Broker</span></div>
                <div class="mqtt-panel">
                    <div class="form-row">
                        <label>服务器</label>
                        <input type="text" id="mqttBroker" value="wss://broker.emqx.io:8084/mqtt" style="width:180px;">
                        <label>ClientID</label>
                        <input type="text" id="mqttClientId" value="st280g_web_xxxx" style="width:120px;" placeholder="自动生成">
                    </div>
                    <div class="form-row">
                        <label>用户名</label>
                        <input type="text" id="mqttUsername" style="width:100px;" placeholder="可选">
                        <label>密码</label>
                        <input type="password" id="mqttPassword" style="width:100px;" placeholder="可选">
                    </div>
                    <div class="form-row">
                        <label>发布主题</label>
                        <input type="text" id="mqttPubTopic" value="st280g/data" style="width:140px;">
                        <label>命令主题</label>
                        <input type="text" id="mqttSubTopic" value="st280g/cmd" style="width:140px;">
                    </div>
                    <div class="form-row">
                        <button class="btn btn-primary" id="btnMqttConnect">🔗 连接MQTT</button>
                        <button class="btn btn-danger" id="btnMqttDisconnect" disabled>断开MQTT</button>
                        <span style="font-size:12px;color:#888;margin-left:8px;" id="mqttStateLabel">未连接</span>
                    </div>
                    <div class="form-row" style="margin-top:4px;">
                        <label><input type="checkbox" id="mqttAutoPublish" checked> 自动发布数据</label>
                        <button class="btn btn-sm btn-outline" id="btnMqttPublishNow">立即发布</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🔄 自动轮询 <span class="badge">串行执行</span></div>
                <div class="form-row">
                    <label><input type="checkbox" id="autoPollCheck"> 启用</label>
                    <label>间隔 <input type="number" id="pollInterval" value="1000" min="500" step="100" style="width:70px;"> ms</label>
                    <button class="btn btn-sm btn-primary" id="btnPollNow">立即轮询</button>
                </div>
                <div style="font-size:12px;color:#888;margin-top:4px;">顺序：读状态 → (若有SOE则读SOE) → 读YC → 读电能</div>
            </div>

            <div class="card">
                <div class="card-title">🎯 手动操作 <span class="badge">单次/对时/复归</span></div>
                <div class="btn-group">
                    <button class="btn btn-outline btn-sm" id="btnSetTime">🕐 对时</button>
                    <button class="btn btn-outline btn-sm" id="btnReset">🔄 复归</button>
                    <button class="btn btn-primary btn-sm" id="btnReadStatus">📊 读状态</button>
                    <button class="btn btn-primary btn-sm" id="btnReadYC">📈 读YC</button>
                    <button class="btn btn-primary btn-sm" id="btnReadEnergy">🔋 读电能</button>
                    <button class="btn btn-warning btn-sm" id="btnReadSOE">📋 读SOE</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🕹️ 遥控 (组0) <span class="badge">预控+执行</span></div>
                <div class="form-row">
                    <label>分闸预令</label>
                    <input type="text" id="cmdOffPre" value="0x0081" class="cmd-input">
                    <label>合闸预令</label>
                    <input type="text" id="cmdOnPre" value="0x0082" class="cmd-input">
                </div>
                <div class="form-row">
                    <label>分闸动令</label>
                    <input type="text" id="cmdOffExec" value="0x0001" class="cmd-input">
                    <label>合闸动令</label>
                    <input type="text" id="cmdOnExec" value="0x0002" class="cmd-input">
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm" style="background:#27ae60;color:#fff;" id="btnYkOnSelect">合闸预控</button>
                    <button class="btn btn-sm" style="background:#e74c3c;color:#fff;" id="btnYkOffSelect">分闸预控</button>
                    <button class="btn btn-sm btn-primary" id="btnYkExecute" disabled>执行动令</button>
                </div>
                <div style="font-size:12px;color:#888;margin-top:6px;">状态: <span id="ykStatus">就绪</span></div>
            </div>

            <div class="card">
                <div class="card-title">📤 自定义帧</div>
                <div class="form-row" style="margin-bottom:0;">
                    <input type="text" id="customFrame" placeholder="例如: 01 03 00 00 00 06" style="flex:1;min-width:140px;">
                    <button class="btn btn-outline btn-sm" id="btnSendCustom">发送</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📝 点表名称 <span class="badge">可编辑</span></div>
                <button class="btn btn-outline btn-sm" id="btnEditNames">✏️ 编辑名称</button>
                <span style="font-size:12px;color:#888;margin-left:8px;">(保存到本地)</span>
            </div>
        </div>

        <!-- 右栏 -->
        <div>
            <div class="card">
                <div class="card-title flex-between">
                    <span>📋 实时数据</span>
                    <span style="font-size:12px;font-weight:400;color:#888;" id="dataUpdateTime">—</span>
                </div>
                <div id="parseContainer"><div class="empty-hint">等待数据…</div></div>
            </div>
            <div class="card">
                <div class="card-title flex-between">
                    <span>📌 SOE 事件记录 <span class="soe-count" id="soeCount">(0)</span></span>
                    <div class="soe-toolbar">
                        <button class="btn btn-sm btn-success" id="btnExportSOE">📤 导出TXT</button>
                        <button class="btn btn-sm btn-primary" id="btnImportSOE">📥 导入TXT</button>
                        <button class="btn btn-sm btn-outline" id="btnClearSOE">清空</button>
                    </div>
                </div>
                <div id="soeContainer" class="soe-scroll"><div class="empty-hint">暂无事件</div></div>
            </div>
            <div class="card" style="padding-bottom:14px;">
                <div class="card-title flex-between">
                    <span>📝 通信日志（含实时解析）</span>
                    <div>
                        <button class="btn btn-sm btn-outline" id="btnClearLog">清空</button>
                        <button class="btn btn-sm btn-outline" id="btnAutoScroll" style="border-color:#2ecc71;color:#2ecc71;">自动滚动</button>
                    </div>
                </div>
                <div class="log-area" id="logArea"></div>
            </div>
        </div>
    </div>
</div>

<!-- Toast 通知 -->
<div class="toast" id="toast"></div>

<!-- 名称编辑模态框 -->
<div class="modal-overlay" id="nameModal">
    <div class="modal-box">
        <h3>编辑点表名称</h3>
        <div style="max-height:60vh;overflow-y:auto;" id="nameEditorContainer"></div>
        <div class="modal-actions">
            <button class="btn btn-primary" id="btnSaveNames">保存</button>
            <button class="btn btn-outline" id="btnCloseNames">关闭</button>
        </div>
    </div>
</div>

<script>
    (function(){
        'use strict';

        // ---------- DOM refs ----------
        const $ = id => document.getElementById(id);
        const statusDot = $('statusDot'), statusText = $('statusText'), portInfo = $('portInfo');
        const logArea = $('logArea'), parseContainer = $('parseContainer'), soeContainer = $('soeContainer');
        const dataUpdateTime = $('dataUpdateTime'), ykStatus = $('ykStatus');
        const soeCount = $('soeCount');

        const btnConnect = $('btnConnect'), btnDisconnect = $('btnDisconnect');
        const btnReadStatus = $('btnReadStatus'), btnReadYC = $('btnReadYC'), btnReadEnergy = $('btnReadEnergy');
        const btnReadSOE = $('btnReadSOE'), btnSetTime = $('btnSetTime'), btnReset = $('btnReset');
        const btnYkOnSelect = $('btnYkOnSelect'), btnYkOffSelect = $('btnYkOffSelect'), btnYkExecute = $('btnYkExecute');
        const btnSendCustom = $('btnSendCustom'), btnClearLog = $('btnClearLog'), btnClearSOE = $('btnClearSOE');
        const btnAutoScroll = $('btnAutoScroll'), btnEditNames = $('btnEditNames');
        const btnSaveNames = $('btnSaveNames'), btnCloseNames = $('btnCloseNames'), btnPollNow = $('btnPollNow');
        const btnExportSOE = $('btnExportSOE'), btnImportSOE = $('btnImportSOE');

        const slaveAddrInput = $('slaveAddr'), baudSelect = $('baudRate'), timeoutInput = $('timeoutMs');
        const timezoneOffsetInput = $('timezoneOffset'), customFrameInput = $('customFrame');
        const autoPollCheck = $('autoPollCheck'), pollIntervalInput = $('pollInterval');
        const soeStartAddrInput = $('soeStartAddr');

        const cmdOffPre = $('cmdOffPre'), cmdOnPre = $('cmdOnPre'), cmdOffExec = $('cmdOffExec'), cmdOnExec = $('cmdOnExec');
        const nameModal = $('nameModal'), nameEditorContainer = $('nameEditorContainer');
        const toast = $('toast');

        // MQTT DOM
        const mqttBroker = $('mqttBroker');
        const mqttClientId = $('mqttClientId');
        const mqttUsername = $('mqttUsername');
        const mqttPassword = $('mqttPassword');
        const mqttPubTopic = $('mqttPubTopic');
        const mqttSubTopic = $('mqttSubTopic');
        const btnMqttConnect = $('btnMqttConnect');
        const btnMqttDisconnect = $('btnMqttDisconnect');
        const mqttStateLabel = $('mqttStateLabel');
        const mqttAutoPublish = $('mqttAutoPublish');
        const btnMqttPublishNow = $('btnMqttPublishNow');

        // ---------- 常量 ----------
        const YX_COUNT = 64, YC_COUNT = 26;
        const DEFAULT_YX_NAMES = Array.from({length:YX_COUNT},(_,i)=>`YX${i+1}`);
        const DEFAULT_YC_NAMES = Array.from({length:YC_COUNT},(_,i)=>`YC${i+1}`);

        function loadNames() {
            let stored;
            try { stored = JSON.parse(localStorage.getItem('st280g_point_names')); } catch(e) { stored = null; }
            if (stored && stored.yx && stored.yx.length===YX_COUNT && stored.yc && stored.yc.length===YC_COUNT) return stored;
            return { yx:[...DEFAULT_YX_NAMES], yc:[...DEFAULT_YC_NAMES] };
        }
        let pointNames = loadNames();
        function saveNamesToStorage() { localStorage.setItem('st280g_point_names', JSON.stringify({ yx:pointNames.yx, yc:pointNames.yc })); }

        const COEFS = [0.000610,0.000610,0.000610,0.000610,0.000610,0.000610,
                       0.030500,0.030500,0.030500,
                       0.305200,0.305200,0.305200,
                       0.305200,0.610400,0.003050,
                       1.220000,1.220000,1.220000,
                       0.000980,0.010000];

        const EVENT_NAMES = {
            0x00:'S1合',0x01:'S2合',0x02:'S3合',0x03:'S4合',0x04:'S5合',0x05:'S6合',0x06:'S7合',0x07:'S8合',
            0x08:'S9合',0x09:'S10合',0x0a:'S11合',0x0b:'S12合',0x0c:'S13合',
            0x0d:'S1分',0x0e:'S2分',0x0f:'S3分',0x10:'S4分',0x11:'S5分',0x12:'S6分',0x13:'S7分',0x14:'S8分',
            0x15:'S9分',0x16:'S10分',0x17:'S11分',0x18:'S12分',0x19:'S13分',
            0x1a:'无效事件',0x1b:'遥控分闸',0x1c:'遥控合闸',0x1d:'设备故障',
            0x1e:'控制回路断线信号动作',0x1f:'控制回路断线信号返回',
            0x20:'过流1段保护动作',0x21:'过流1段保护返回',
            0x22:'过流2段保护动作',0x23:'过流2段保护返回',
            0x24:'过流3段保护动作',0x25:'过流3段保护返回',
            0x26:'过负荷保护动作',0x27:'过负荷保护返回',
            0x28:'负序过流保护动作',0x29:'负序过流保护返回',

        // ---------- 工具函数 ----------
        function crc16(data) {
            let crc=0xFFFF;
            for(let i=0;i<data.length;i++){ crc ^= data[i]; for(let j=0;j<8;j++){ if(crc&0x0001) crc=(crc>>1)^0xA001; else crc>>=1; } }
            return crc;
        }
        function makeFrame(data) {
            const crc=crc16(data);
            const frame=new Uint8Array(data.length+2);
            frame.set(data);
            frame[data.length]=crc&0xFF;
            frame[data.length+1]=(crc>>8)&0xFF;
            return frame;
        }
        function checkCRC(frame) {
            if(frame.length<2) return false;
            const crc=crc16(frame.subarray(0,frame.length-2));
            return (crc&0xFF)===frame[frame.length-2] && ((crc>>8)&0xFF)===frame[frame.length-1];
        }
        function toHex(arr, sep=' ') { return Array.from(arr).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(sep); }
        function hexToBytes(str) {
            const s=str.replace(/\s+/g,'');
            if(s.length%2) return null;
            const bytes=new Uint8Array(s.length/2);
            for(let i=0;i<s.length;i+=2) bytes[i/2]=parseInt(s.substr(i,2),16);
            return bytes;
        }
        function getSlaveAddr(){ return parseInt(slaveAddrInput.value)||1; }
        function getTimeout(){ return parseInt(timeoutInput.value)||2000; }
        function getTimezoneOffset(){ return (parseFloat(timezoneOffsetInput.value)||0)*3600; }
        function parseHexCmd(str){ const s=str.trim().replace(/^0x/i,''); if(!/^[0-9A-Fa-f]{1,4}$/.test(s)) return null; return parseInt(s,16); }
        function getSOEStartAddr(){
            const s=soeStartAddrInput.value.trim().replace(/^0x/i,'');
            if(!/^[0-9A-Fa-f]{1,4}$/.test(s)) return 0x03E8;
            return parseInt(s,16);
        }

        // ---------- 报文解析函数（与原版相同） ----------
        function getAddrDescription(addr) {
            if (addr >= 0x0000 && addr < 0x0006) return `YX状态区 (0x${addr.toString(16)})`;
            if (addr >= 0x0006 && addr < 0x001A) return `YC模拟量区 (0x${addr.toString(16)})`;
            if (addr >= 0x0050 && addr < 0x0060) return `电能区 (0x${addr.toString(16)})`;
            if (addr >= 0x03E8 && addr < 0x0400) return `SOE事件区 (0x${addr.toString(16)})`;
            if (addr === 0x07D0) return `遥控命令区`;
            if (addr === 0x0834) return `复归命令区`;
            if (addr === 0x0898) return `对时区`;
            return null;
        }

        function parseModbusFrame(frame, direction) {
            if (!frame || frame.length < 2) return '帧太短';
            const addr = frame[0];
            const func = frame[1];
            const funcNames = {
                0x01:'读线圈',0x02:'读离散输入',0x03:'读保持寄存器',0x04:'读输入寄存器',
                0x05:'写单个线圈',0x06:'写单个寄存器',0x0F:'写多个线圈',0x10:'写多个寄存器',0x17:'读写多个寄存器'
            };
            const funcName = funcNames[func] || `未知功能码(0x${func.toString(16).padStart(2,'0')})`;
            let crcOk = checkCRC(frame);
            let parseStr = `从站=${addr}, 功能码=${funcName}`;
            if (!crcOk) parseStr += ' ⚠️ CRC错误';

            try {
                if (direction === 'tx') {
                    if (func === 0x03 || func === 0x04) {
                        if (frame.length >= 6) {
                            const startAddr = (frame[2]<<8) | frame[3];
                            const quantity = (frame[4]<<8) | frame[5];
                            parseStr += `, 起始地址=0x${startAddr.toString(16).padStart(4,'0')}`;
                            let desc = getAddrDescription(startAddr);
                            if (desc) parseStr += ` (${desc})`;
                            parseStr += `, 寄存器数=${quantity}`;
                        }
                    } else if (func === 0x06) {
                        if (frame.length >= 6) {
                            const regAddr = (frame[2]<<8)|frame[3];
                            const value = (frame[4]<<8)|frame[5];
                            parseStr += `, 寄存器=0x${regAddr.toString(16).padStart(4,'0')}, 值=${value}`;
                        }
                    } else if (func === 0x10) {
                        if (frame.length >= 7) {
                            const startAddr = (frame[2]<<8)|frame[3];
                            const quantity = (frame[4]<<8)|frame[5];
                            const byteCount = frame[6];
                            parseStr += `, 起始地址=0x${startAddr.toString(16).padStart(4,'0')}`;
                            let desc = getAddrDescription(startAddr);
                            if (desc) parseStr += ` (${desc})`;
                            parseStr += `, 寄存器数=${quantity}, 字节数=${byteCount}`;
                            if (frame.length >= 7 + byteCount) {
                                let dataHex = toHex(frame.slice(7, 7+byteCount));
                                parseStr += `, 数据=${dataHex}`;
                            }
                        }
                    } else if (func === 0x17) {
                        if (frame.length >= 13) {
                            const readAddr = (frame[2]<<8)|frame[3];
                            const readQty = (frame[4]<<8)|frame[5];
                            const writeAddr = (frame[6]<<8)|frame[7];
                            const writeQty = (frame[8]<<8)|frame[9];
                            const byteCount = frame[10];
                            parseStr += `, 读起始=0x${readAddr.toString(16).padStart(4,'0')}, 读数量=${readQty}`;
                            parseStr += `, 写起始=0x${writeAddr.toString(16).padStart(4,'0')}, 写数量=${writeQty}`;
                            if (frame.length >= 11 + byteCount) {
                                let dataHex = toHex(frame.slice(11, 11+byteCount));
                                parseStr += `, 写数据=${dataHex}`;
                            }
                        }
                    } else {
                        if (frame.length > 2) {
                            let dataHex = toHex(frame.slice(2, frame.length-2));
                            parseStr += `, 数据=${dataHex}`;
                        }
                    }
                } else { // RX
                    if (func === 0x03 || func === 0x04) {
                        if (frame.length >= 3) {
                            const byteCount = frame[2];
                            parseStr += `, 字节数=${byteCount}`;
                            if (frame.length >= 3 + byteCount) {
                                const data = frame.slice(3, 3+byteCount);
                                let regs = [];
                                for (let i=0; i<byteCount; i+=2) {
                                    if (i+1 < byteCount) {
                                        let val = (data[i]<<8) | data[i+1];
                                        regs.push(val);
                                    }
                                }
                                if (regs.length > 0) {
                                    let valStr = regs.map(v => v.toString(16).padStart(4,'0')).join(' ');
                                    parseStr += `, 寄存器值: ${valStr}`;
                                }
                            }
                        }
                    } else if (func === 0x06 || func === 0x10 || func === 0x05 || func === 0x0F) {
                        parseStr += `, 响应正常`;
                    } else if (func === 0x17) {
                        if (frame.length >= 3) {
                            const byteCount = frame[2];
                            parseStr += `, 字节数=${byteCount}`;
                            if (frame.length >= 3 + byteCount) {
                                let dataHex = toHex(frame.slice(3, 3+byteCount));
                                parseStr += `, 数据=${dataHex}`;
                            }
                        }
                    } else if (func >= 0x80) {
                        const errCode = frame[2];
                        const errMsg = {0x01:'非法功能',0x02:'非法数据地址',0x03:'非法数据值',0x04:'从站故障'}[errCode] || `错误码0x${errCode.toString(16)}`;
                        parseStr += `, 异常: ${errMsg}`;
                    } else {
                        if (frame.length > 2) {
                            let dataHex = toHex(frame.slice(2, frame.length-2));
                            parseStr += `, 数据=${dataHex}`;
                        }
                    }
                }
            } catch(e) {
                parseStr += ' [解析异常]';
            }
            return parseStr;
        }

        // ---------- 日志函数 ----------
        function logWithParse(msg, cls='log-info', extraParse='') {
            const time=new Date().toLocaleTimeString();
            const line=document.createElement('div');
            let content = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;

            logArea.appendChild(line);
            if(autoScroll) logArea.scrollTop=logArea.scrollHeight;

        function log(msg, cls='log-info') { logWithParse(msg, cls, ''); }
        function logTx(data) {
            const hexStr = toHex(data);
            const parseResult = parseModbusFrame(data, 'tx');
            logWithParse(`▶ TX: ${hexStr}`, 'log-tx', '解析: ' + parseResult);
        }
        function logRx(data) {
            const hexStr = toHex(data);
            const parseResult = parseModbusFrame(data, 'rx');
            logWithParse(`◀ RX: ${hexStr}`, 'log-rx', '解析: ' + parseResult);

        // ---------- 渲染 ----------

        // ========== SOE 事件管理 ==========
        function formatSOETime(soe) {
            return `${soe.year}-${String(soe.month).padStart(2,'0')}-${String(soe.day).padStart(2,'0')} ` +
                   `${String(soe.hour).padStart(2,'0')}:${String(soe.min).padStart(2,'0')}:${String(soe.sec).padStart(2,'0')}.${String(soe.ms).padStart(3,'0')}`;
        }

        function renderSOE() {
            const container = soeContainer;
            if (soeEvents.length === 0) {
                container.innerHTML = '<div class="empty-hint">暂无事件</div>';
                soeCount.textContent = '(0)';
                return;
            }
            let html = '';
            for (const soe of soeEvents) {
                const timeStr = formatSOETime(soe);
                const yxLabel = (soe.yx_index >= 0 && soe.yx_index < YX_COUNT) ? 
                    (pointNames.yx[soe.yx_index] || `YX${soe.yx_index+1}`) : '—';
                const yxVal = soe.yx_value ? '合' : '分';
                const idxDisplay = (soe.yx_index >= 0 && soe.yx_index < YX_COUNT) ? `#${soe.yx_index+1}` : '';
                html += `<div class="soe-item" data-idx="${soeEvents.indexOf(soe)}">
                    <span><span class="time">${timeStr}</span> &nbsp;|&nbsp; <span class="desc">${soe.desc||'未知事件'}</span></span>
                    <span><span class="yx">${yxLabel} → ${yxVal}</span> <span class="idx-badge">${idxDisplay}</span></span>
                </div>`;
            }
            container.innerHTML = html;
            soeCount.textContent = `(${soeEvents.length})`;
        }

        function addSOE(soe) {
            soeEvents.unshift(soe);
            if (soeEvents.length > MAX_SOE) {
                soeEvents = soeEvents.slice(0, MAX_SOE);
            }
            renderSOE();
            publishData(); // 发布更新
        }

        function addSOEWithoutUpdate(soe) {
            soeEvents.unshift(soe);
            if (soeEvents.length > MAX_SOE) {
                soeEvents = soeEvents.slice(0, MAX_SOE);
            }
            renderSOE();

        // ---------- 导出/导入 SOE ----------
        function exportSOE() {
            if (soeEvents.length === 0) {
                showToast('没有SOE事件可导出', 'error');
                return;
            }
            const lines = [];
            const now = new Date();
            lines.push('# ST280G SOE 事件导出');
            lines.push(`# 导出时间: ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`);
            lines.push(`# 事件总数: ${soeEvents.length}`);
            lines.push('# 格式: 时间 | 事件描述 | YX编号(1-based) | 状态(合/分)');
            lines.push('# YX编号从1开始，对应界面上的YX1~YX64');
            lines.push('');
            for (const soe of soeEvents) {
                const timeStr = formatSOETime(soe);
                const desc = soe.desc || '未知事件';
                const yxNum = (soe.yx_index >= 0 && soe.yx_index < YX_COUNT) ? (soe.yx_index + 1) : 0;
                const status = soe.yx_value ? '合' : '分';
                lines.push(`${timeStr} | ${desc} | ${yxNum} | ${status}`);
            }
            const content = lines.join('\n');
            const blob = new Blob(['\uFEFF' + content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = now.toISOString().slice(0,10);
            a.download = `SOE_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`导出 ${soeEvents.length} 条SOE事件成功`, 'success');
            log(`📤 导出SOE事件 ${soeEvents.length} 条`, 'log-info');
        }

        function importSOE() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.csv';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const content = ev.target.result;
                        const lines = content.split(/\r?\n/);
                        let count = 0, skipped = 0, imported = [];
                        for (let line of lines) {
                            line = line.trim();
                            if (!line || line.startsWith('#')) continue;
                            const parts = line.split('|').map(s => s.trim());
                            if (parts.length < 4) { skipped++; continue; }
                            const [timeStr, desc, yxNumStr, statusStr] = parts;
                            const timeMatch = timeStr.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})\.(\d{3})/);
                            if (!timeMatch) { skipped++; continue; }
                            const [, year, month, day, hour, min, sec, ms] = timeMatch.map(Number);
                            let yxIndex = parseInt(yxNumStr) - 1;
                            if (isNaN(yxIndex) || yxIndex < 0) yxIndex = -1;
                            if (yxIndex >= YX_COUNT) yxIndex = YX_COUNT - 1;
                            const yxValue = (statusStr === '合' || statusStr === '1' || statusStr === 'ON') ? 1 : 0;
                            const soe = { year, month, day, hour, min, sec, ms, yx_index: yxIndex, yx_value: yxValue, desc: desc || '未知事件' };
                            imported.push(soe);
                            count++;
                        }
                        if (count === 0) {
                            showToast('未解析到有效SOE事件，请检查格式', 'error');
                            log('⚠️ 导入SOE失败: 未解析到有效事件', 'log-warn');
                            return;
                        }
                        for (const soe of imported) addSOEWithoutUpdate(soe);
                        renderSOE();
                        showToast(`成功导入 ${count} 条SOE事件${skipped > 0 ? `，跳过 ${skipped} 行` : ''}`, 'success');
                        log(`📥 导入SOE事件 ${count} 条${skipped > 0 ? `，跳过 ${skipped} 行` : ''}`, 'log-info');
                    } catch (err) {
                        showToast('导入失败: ' + err.message, 'error');
                        logErr('导入SOE失败: ' + err.message);
                    }
                };
                reader.onerror = function() { showToast('读取文件失败', 'error'); };
                reader.readAsText(file);
            };
            input.click();
        }

        // ========== MQTT 功能 ==========
        function updateMqttUI(connected) {
            mqttConnected = connected;

            mqttStateLabel.textContent = connected ? '已连接' : '未连接';
            document.getElementById('mqttStatus').textContent = 'MQTT: ' + (connected ? '已连接' : '未连接');
            // 修改状态点颜色（可选）
        }

        async function mqttConnect() {
            if (mqttConnected) return;
            const broker = mqttBroker.value.trim();
            if (!broker) { showToast('请输入MQTT服务器地址', 'error'); return; }
            const clientId = mqttClientId.value.trim() || generateClientId();
            const username = mqttUsername.value.trim() || undefined;
            const password = mqttPassword.value.trim() || undefined;

            try {
                const options = {
                    clientId: clientId,
                    username: username,
                    password: password,
                    clean: true,
                    reconnectPeriod: 1000,
                    connectTimeout: 30 * 1000,
                    will: { topic: mqttPubTopic.value, payload: 'offline', qos: 0, retain: false }
                };
                mqttClient = mqtt.connect(broker, options);

                mqttClient.on('connect', () => {
                    log('✅ MQTT 连接成功', 'log-info');
                    showToast('MQTT 已连接', 'success');
                    updateMqttUI(true);
                    // 订阅命令主题
                    const subTopic = mqttSubTopic.value.trim();
                    if (subTopic) {
                        mqttClient.subscribe(subTopic, { qos: 1 }, (err) => {
                            if (err) logErr('订阅命令主题失败: ' + err.message);
                            else log(`📡 已订阅命令主题: ${subTopic}`, 'log-info');
                        });
                    }
                    // 发布一次当前数据
                    publishData();
                });

                mqttClient.on('message', (topic, message) => {
                    const payload = message.toString();
                    log(`📨 收到命令 (${topic}): ${payload}`, 'log-info');
                    handleRemoteCommand(payload);
                });

                mqttClient.on('error', (err) => {
                    logErr('MQTT 错误: ' + err.message);
                    showToast('MQTT 错误: ' + err.message, 'error');
                });

                mqttClient.on('close', () => {
                    if (mqttConnected) {
                        log('⚠️ MQTT 连接断开', 'log-warn');
                        updateMqttUI(false);
                    }
                });

                mqttClient.on('offline', () => {
                    log('⚠️ MQTT 离线', 'log-warn');
                    updateMqttUI(false);
                });

            } catch (err) {
                logErr('MQTT 连接失败: ' + err.message);
                showToast('MQTT 连接失败: ' + err.message, 'error');
            }
        }

        function mqttDisconnect() {
            if (mqttClient) {
                mqttClient.end(true, () => {
                    log('🔌 MQTT 已断开', 'log-warn');
                    updateMqttUI(false);
                    mqttClient = null;
                });
            } else {
                updateMqttUI(false);
            }
        }

        // 发布数据（JSON格式）
        function publishData() {
            if (!mqttConnected || !mqttClient || !mqttAutoPublish.checked) return;
            const topic = mqttPubTopic.value.trim();
            if (!topic) return;
            try {
                const data = {
                    timestamp: new Date().toISOString(),
                    yx: yxValues.slice(),
                    yc: ycValues.slice(),
                    soe: soeEvents.slice(0, 10), // 只发最近10条
                    yx_names: pointNames.yx,
                    yc_names: pointNames.yc
                };
                const payload = JSON.stringify(data);
                mqttClient.publish(topic, payload, { qos: 1, retain: false }, (err) => {
                    if (err) logErr('发布数据失败: ' + err.message);
                    else log(`📤 已发布数据到 ${topic}`, 'log-info');
                });
            } catch (e) {
                logErr('打包数据失败: ' + e.message);
            }
        }

        // 处理远程命令
        async function handleRemoteCommand(payload) {
            let cmdObj;
            try {
                cmdObj = JSON.parse(payload);
            } catch (e) {
                logErr('无效的 JSON 命令: ' + payload);
                return;
            }
            const cmd = cmdObj.cmd;
            if (!cmd) { logWarn('命令缺少 "cmd" 字段'); return; }

            log(`🔹 执行远程命令: ${cmd}`, 'log-info');
            let result = { cmd: cmd, status: 'success', message: '' };
            try {
                switch (cmd) {
                    case 'read_status':
                        await requestStatus();
                        if (soePending) { soePending = false; await requestSOE(); }
                        result.message = '读状态完成';
                        break;
                    case 'read_yc':
                        await requestYC();
                        result.message = '读YC完成';
                        break;
                    case 'read_energy':
                        await requestEnergy();
                        result.message = '读电能完成';
                        break;
                    case 'read_soe':
                        await requestSOE();
                        result.message = '读SOE完成';
                        break;
                    case 'set_time':
                        await requestSetTime();
                        result.message = '对时完成';
                        break;
                    case 'reset':
                        await requestReset();
                        result.message = '复归完成';
                        break;
                    case 'yk_on':
                        await ykSelect('on');
                        if (ykSelected) {
                            await ykExecute();
                            result.message = '遥控合闸执行';
                        } else {
                            result.status = 'error';
                            result.message = '预令失败';
                        }
                        break;
                    case 'yk_off':
                        await ykSelect('off');
                        if (ykSelected) {
                            await ykExecute();
                            result.message = '遥控分闸执行';
                        } else {
                            result.status = 'error';
                            result.message = '预令失败';
                        }
                        break;
                    case 'ping':
                        result.message = 'pong';
                        break;
                    default:
                        result.status = 'error';
                        result.message = '未知命令: ' + cmd;
                }
            } catch (err) {
                result.status = 'error';
                result.message = err.message;
                logErr('远程命令执行异常: ' + err.message);
            }
            // 发送结果（通过数据主题或专用响应主题？用数据主题统一反馈）
            if (mqttConnected && mqttClient) {
                const topic = mqttPubTopic.value.trim();
                if (topic) {
                    const resp = {
                        timestamp: new Date().toISOString(),
                        response: result
                    };
                    mqttClient.publish(topic, JSON.stringify(resp), { qos: 1 }, (err) => {
                        if (err) logErr('发布响应失败: ' + err.message);
                        else log(`📤 已返回命令结果到 ${topic}`, 'log-info');
                    });
                }
            }
        }

        // ---------- 串口读写函数（与原版完全相同，但增加 publishData 调用） ----------
        // 以下函数与原始代码一致，只是对 requestStatus, requestYC, requestEnergy, parseSOE 等增加了 publishData 调用
        // 为了减少篇幅，这里只列关键修改，但为完整性，我们复制原逻辑并添加 publishData。

        // ----- 串口连接、断开、读写（沿用原代码）-----
        async function connect() {
            if(isConnected) return;
            try {
                if(!('serial' in navigator)){ alert('浏览器不支持 Web Serial API'); return; }
                const portObj=await navigator.serial.requestPort();
                const baud=parseInt(baudSelect.value);
                await portObj.open({ baudRate:baud, dataBits:8, stopBits:1, parity:'none' });
                port=portObj;
                isConnected=true;
                updateUI(true);
                log(`🔗 已连接 (${baud} bps)`,'log-info');
                portInfo.textContent=`${baud} bps`;
                startReader();
            } catch(err){ logErr('连接失败: '+err.message); }
        }
        async function disconnect() {
            if(!isConnected) return;
            try {
                if(reader){ await reader.cancel(); reader=null; }
                if(writer){ await writer.close(); writer=null; }
                if(port){ await port.close(); port=null; }
                isConnected=false;
                updateUI(false);
                portInfo.textContent='—';
                log('🔌 已断开','log-warn');
                stopPolling();
            } catch(err){ logErr('断开失败: '+err.message); }
        }
        async function startReader() {
            if(!port) return;
            try {
                reader=port.readable.getReader();
                let buffer=new Uint8Array(0);
                while(true){
                    const {value,done}=await reader.read();
                    if(done) break;
                    if(value){
                        const newBuf=new Uint8Array(buffer.length+value.length);
                        newBuf.set(buffer);
                        newBuf.set(value,buffer.length);
                        buffer=newBuf;
                        while(buffer.length>=5){
                            const addr=buffer[0];
                            const func=buffer[1];
                            let frameLen=0;
                            if(func===0x03||func===0x04){
                                if(buffer.length<3) break;
                                const byteCount=buffer[2];
                                frameLen=3+byteCount+2;
                            } else if(func===0x10||func===0x06||func===0x05||func===0x0F){
                                frameLen=8;
                            } else if(func===0x17){
                                if(buffer.length<3) break;
                                const byteCount=buffer[2];
                                frameLen=3+byteCount+2;
                            } else { break; }
                            if(buffer.length<frameLen) break;
                            const frame=buffer.subarray(0,frameLen);
                            buffer=buffer.subarray(frameLen);
                            if(!checkCRC(frame)){ logErr('CRC 校验失败: '+toHex(frame)); continue; }
                            if(frame[0]!==getSlaveAddr()){ logWarn(`地址不匹配: 期望 ${getSlaveAddr()}, 收到 ${frame[0]}`); continue; }
                            logRx(frame);
                            handleResponse(frame);
                        }
                    }
                }
            } catch(err) {
                if(err.name!=='AbortError' && err.name!=='CancelError') logErr('读取错误: '+err.message);
            } finally {
                reader=null;
                if(isConnected){ logWarn('读取循环结束，尝试重新连接...'); await disconnect(); }
            }
        }

        function sendData(data) {
            return new Promise(async (resolve,reject)=>{
                if(!isConnected||!port){ reject(new Error('未连接')); return; }
                try {
                    if(!writer) writer=port.writable.getWriter();
                    const frame=makeFrame(data);
                    logTx(frame);
                    await writer.write(frame);
                    pendingResolve=resolve;
                    pendingTimeout=setTimeout(()=>{ pendingResolve=null; reject(new Error('响应超时')); }, getTimeout());
                } catch(err){ reject(err); }
            });
        }
        function handleResponse(frame) {
            if(pendingResolve){
                clearTimeout(pendingTimeout);
                const resolve=pendingResolve;
                pendingResolve=null;
                resolve(frame);
            } else {
                processFrame(frame);
            }
        }
        function processFrame(frame) {
            const func=frame[1];
            if(func===0x17) parseSOE(frame);
            else if(func===0x03||func===0x04){
                if(frame.length>=17) parseStatus(frame);
                if(frame.length>=45) parseYC(frame);
                if(frame.length>=37) parseEnergy(frame);
            } else logWarn('未处理的帧: '+toHex(frame));
        }

        // ----- 解析函数（加入 publishData）-----
        function parseStatus(frame) {
            if(frame.length<17){ logErr('状态帧长度不足'); return; }
            const byteCount=frame[2];
            if(byteCount!==12){ logErr(`状态字节数异常: ${byteCount}, 期望 12`); return; }
            const status1=(frame[3]<<8)|frame[4];
            const di1=(frame[7]<<8)|frame[8];
            for(let i=0;i<13;i++){ const val=(di1>>i)&0x01; updateYX(2+i,val); }
            logData(`状态: status1=0x${status1.toString(16).padStart(4,'0')}, DI=0x${di1.toString(16).padStart(4,'0')}`);
            if((status1 & 0x0002) !== 0){
                logWarn('检测到 SOE 事件标志 (status1 bit1=1)');
                soePending = true;
            } else {
                soePending = false;
            }
            publishData();
        }
        function parseYC(frame) {
            if(frame.length<45){ logErr('YC帧长度不足'); return; }
            const byteCount=frame[2];
            if(byteCount!==40){ logErr(`YC字节数异常: ${byteCount}, 期望 40`); return; }
            for(let i=0;i<20;i++){
                const raw=(frame[3+i*2]<<8)|frame[4+i*2];
                let val=raw; if(val>0x7FFF) val=val-0x10000;
                const coef=COEFS[i]||1.0;
                updateYC(i,val*coef);
            }
            logData('YC 已更新 (20个模拟量)');
            publishData();
        }
        function parseEnergy(frame) {
            if(frame.length<37){ logErr('电能帧长度不足'); return; }
            const byteCount=frame[2];
            if(byteCount!==32){ logErr(`电能字节数异常: ${byteCount}, 期望 32`); return; }
            const offsets=[0,4,8,12];
            const labels=['正向有功','反向有功','正向无功','反向无功'];
            for(let idx=0;idx<4;idx++){
                const off=offsets[idx];
                const high=(frame[3+off]<<8)|frame[4+off];
                const low=(frame[5+off]<<8)|frame[6+off];
                const val=(high<<16)|low;
                updateYC(20+idx,val);
                logData(`${labels[idx]}电能: ${val}`);
            }
            publishData();
        }
        function parseSOE(frame) {
            if(frame.length<35){ logErr('SOE帧长度不足'); return; }
            const byteCount=frame[2];
            if(byteCount<30){ logErr(`SOE字节数异常: ${byteCount}, 期望 >=30`); return; }
            const sec_high=(frame[3]<<8)|frame[4];
            const sec_low=(frame[5]<<8)|frame[6];
            const ms=(frame[7]<<8)|frame[8];
            const typeCode=(frame[9]<<8)|frame[10];
            const seconds=(sec_high<<16)|sec_low;
            const adjustedSeconds = seconds - getTimezoneOffset();
            const base=Date.UTC(2000,0,1,0,0,0);
            const timestamp=base + adjustedSeconds*1000 + ms;
            const d=new Date(timestamp);
            const eventCode=(typeCode>>8)&0xFF;
            const eventName=EVENT_NAMES[eventCode]||`未知事件(0x${eventCode.toString(16).padStart(2,'0')})`;
            let yxIndex=-1, yxValue=0;
            const map=EVENT_MAP[eventCode];
            if(map){ yxIndex=map[0]; yxValue=map[1]; }
            else {
                if(eventCode>=0x00&&eventCode<=0x0C){ yxIndex=2+eventCode; yxValue=1; }
                else if(eventCode>=0x0D&&eventCode<=0x19){ yxIndex=2+(eventCode-0x0D); yxValue=0; }
            }
            if(yxIndex>=0&&yxIndex<YX_COUNT) updateYX(yxIndex,yxValue);
            const soe={
                year:d.getFullYear(), month:d.getMonth()+1, day:d.getDate(),
                hour:d.getHours(), min:d.getMinutes(), sec:d.getSeconds(),
                ms:ms%1000,
                yx_index:yxIndex, yx_value:yxValue,
                desc:eventName
            };
            addSOE(soe);
            logData(`📌 SOE: ${eventName} (${yxIndex>=0?pointNames.yx[yxIndex]||'YX'+(yxIndex+1):'—'} → ${yxValue?'合':'分'})`);
            publishData();
        }

        // ----- 请求函数（沿用原代码）-----
        async function requestStatus() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const data=new Uint8Array([addr,0x03,0x00,0x00,0x00,0x06]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x03) parseStatus(resp);
                else if(resp[1]===0x83) logErr(`读状态异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('读状态失败: '+err.message); }
        }
        async function requestSOE() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const startAddr=getSOEStartAddr();
            const data=new Uint8Array([
                addr,0x17,
                (startAddr>>8)&0xFF, startAddr&0xFF,
                0x00,0x10,
                0x08,0x36,
                0x00,0x01,
                0x02,
                0xFF,0xFF
            ]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x17) parseSOE(resp);
                else if(resp[1]===0x97) logErr(`读SOE异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('读SOE失败: '+err.message); }
        }
        async function requestYC() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const data=new Uint8Array([addr,0x03,0x00,0x06,0x00,0x14]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x03) parseYC(resp);
                else if(resp[1]===0x83) logErr(`读YC异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('读YC失败: '+err.message); }
        }
        async function requestEnergy() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const data=new Uint8Array([addr,0x03,0x00,0x50,0x00,0x10]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x03) parseEnergy(resp);
                else if(resp[1]===0x83) logErr(`读电能异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('读电能失败: '+err.message); }
        }
        async function requestSetTime() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const now=Math.floor(Date.now()/1000)+getTimezoneOffset();
            const base=Date.UTC(2000,0,1,0,0,0)/1000;
            const seconds=now-base;
            const high=(seconds>>16)&0xFFFF;
            const low=seconds&0xFFFF;
            const ms=0;
            const data=new Uint8Array([
                addr,0x10,
                0x08,0x98,
                0x00,0x03,
                0x06,
                (high>>8)&0xFF, high&0xFF,
                (low>>8)&0xFF, low&0xFF,
                (ms>>8)&0xFF, ms&0xFF
            ]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x10) logData('✅ 对时成功');
                else if(resp[1]===0x90) logErr(`对时异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('对时失败: '+err.message); }
        }
        async function requestReset() {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            const data=new Uint8Array([addr,0x10,0x08,0x34,0x00,0x01,0x02,0x00,0x00]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x10) logData('✅ 复归成功');
                else if(resp[1]===0x90) logErr(`复归异常: 0x${resp[2].toString(16).padStart(2,'0')}`);
                else logErr(`未知响应功能码: 0x${resp[1].toString(16)}`);
            } catch(err){ logErr('复归失败: '+err.message); }
        }

        // ---------- 遥控 ----------
        async function ykSelect(onoff) {
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            let cmd;
            if(onoff==='on'){
                const val=parseHexCmd(cmdOnPre.value);
                if(val===null){ logErr('合闸预令格式错误'); return; }
                cmd=val;
            } else {
                const val=parseHexCmd(cmdOffPre.value);
                if(val===null){ logErr('分闸预令格式错误'); return; }
                cmd=val;
            }
            const data=new Uint8Array([
                addr,0x10,
                0x07,0xD0,
                0x00,0x01,
                0x02,
                (cmd>>8)&0xFF, cmd&0xFF
            ]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x10){
                    logData(`✅ 预令成功 (${onoff==='on'?'合闸':'分闸'})`);
                    ykSelected=onoff;
                    btnYkExecute.disabled=false;
                    ykStatus.textContent=`已预控 ${onoff==='on'?'合闸':'分闸'}，请执行`;
                } else {
                    logErr(`预令失败: 0x${resp[1].toString(16)}`);
                    ykSelected=null;
                    btnYkExecute.disabled=true;
                    ykStatus.textContent='预令失败';
                }
            } catch(err){
                logErr('预令失败: '+err.message);
                ykSelected=null;
                btnYkExecute.disabled=true;
                ykStatus.textContent='预令异常';
            }
        }
        async function ykExecute() {
            if(!ykSelected){ logErr('请先发送预令'); return; }
            if(!isConnected){ logErr('未连接'); return; }
            const addr=getSlaveAddr();
            let cmd;
            if(ykSelected==='on'){
                const val=parseHexCmd(cmdOnExec.value);
                if(val===null){ logErr('合闸动令格式错误'); return; }
                cmd=val;
            } else {
                const val=parseHexCmd(cmdOffExec.value);
                if(val===null){ logErr('分闸动令格式错误'); return; }
                cmd=val;
            }
            const data=new Uint8Array([
                addr,0x10,
                0x07,0xD0,
                0x00,0x01,
                0x02,
                (cmd>>8)&0xFF, cmd&0xFF
            ]);
            try {
                const resp=await sendData(data);
                if(resp[1]===0x10){
                    logData(`✅ 动令执行成功 (${ykSelected==='on'?'合闸':'分闸'})`);
                    ykStatus.textContent='执行成功';
                    btnYkExecute.disabled=true;
                    ykSelected=null;
                } else {
                    logErr(`动令失败: 0x${resp[1].toString(16)}`);
                    ykStatus.textContent='执行失败';
                }
            } catch(err){
                logErr('动令失败: '+err.message);
                ykStatus.textContent='执行异常';
            }
        }

        // ---------- 自定义 ----------
        async function sendCustom() {
            const input=customFrameInput.value.trim();
            if(!input){ logWarn('请输入十六进制数据'); return; }
            const bytes=hexToBytes(input);
            if(!bytes||bytes.length===0){ logErr('无效的十六进制格式'); return; }
            if(!isConnected){ logErr('未连接'); return; }
            try {
                const resp=await sendData(bytes);
                logData(`响应: ${toHex(resp)}`);
                if(resp.length>=3){
                    const func=resp[1];
                    if(func===0x03||func===0x04){
                        if(resp.length>=17) parseStatus(resp);
                        if(resp.length>=45) parseYC(resp);
                        if(resp.length>=37) parseEnergy(resp);
                    } else if(func===0x17) parseSOE(resp);
                    else if(func===0x10) logData('写操作成功');
                }
            } catch(err){ logErr('自定义帧发送失败: '+err.message); }
        }

        // ---------- 轮询 ----------
        async function pollCycle() {
            if(isPolling || !isConnected || !autoPollCheck.checked) return;
            isPolling=true;
            try {
                await requestStatus();
                if(soePending){
                    soePending=false;
                    await requestSOE();
                }
                await requestYC();
                await requestEnergy();
            } catch(e) {} finally { isPolling=false; }
        }
        function startPolling() {
            stopPolling();
            if(!autoPollCheck.checked) return;
            const interval=parseInt(pollIntervalInput.value)||1000;
            const validInterval=Math.max(interval,500);
            pollTimer=setInterval(()=>{ pollCycle(); }, validInterval);
            log(`🔄 自动轮询已启动 (间隔 ${validInterval}ms)`,'log-info');
        }
        function stopPolling() {
            if(pollTimer){ clearInterval(pollTimer); pollTimer=null; isPolling=false; log('⏹️ 自动轮询已停止','log-info'); }
        }
        function pollNow() {
            if(!isConnected){ logErr('未连接'); return; }
            if(isPolling){ logWarn('轮询进行中，请稍后'); return; }
            pollCycle();
        }
        async function readStatusAndSOE() {
            if(!isConnected){ logErr('未连接'); return; }
            await requestStatus();
            if(soePending){
                soePending=false;
                await requestSOE();
            }
        }

        // ---------- 名称编辑 ----------
        function openNameEditor() {
            let html='<h4>遥信 (YX)</h4>';
            for(let i=0;i<YX_COUNT;i++){ html+=`<div class="name-row"><span>YX${i+1}</span><input type="text" id="name_yx_${i}" value="${pointNames.yx[i]||''}" placeholder="输入名称"></div>`; }
            html+='<h4 style="margin-top:12px;">遥测 (YC)</h4>';
            for(let i=0;i<YC_COUNT;i++){ html+=`<div class="name-row"><span>YC${i+1}</span><input type="text" id="name_yc_${i}" value="${pointNames.yc[i]||''}" placeholder="输入名称"></div>`; }
            nameEditorContainer.innerHTML=html;
            nameModal.classList.add('active');
        }
        function saveNames() {
            const newYx=[]; for(let i=0;i<YX_COUNT;i++){ const el=document.getElementById(`name_yx_${i}`); newYx.push(el?el.value.trim()||`YX${i+1}`:`YX${i+1}`); }
            const newYc=[]; for(let i=0;i<YC_COUNT;i++){ const el=document.getElementById(`name_yc_${i}`); newYc.push(el?el.value.trim()||`YC${i+1}`:`YC${i+1}`); }
            pointNames.yx=newYx; pointNames.yc=newYc;
            saveNamesToStorage();
            renderParse();
            renderSOE();
            nameModal.classList.remove('active');
            log('✅ 点表名称已保存','log-info');
            showToast('点表名称已保存', 'success');
        }

        // ---------- UI ----------
        function updateUI(connected) {
            isConnected=connected;
            statusDot.className='status-dot '+(connected?'connected':'disconnected');
            statusText.textContent=connected?'已连接':'未连接';
            btnConnect.disabled=connected;
            btnDisconnect.disabled=!connected;
            const btns=[btnReadStatus,btnReadYC,btnReadEnergy,btnReadSOE,btnSetTime,btnReset,
                        btnYkOnSelect,btnYkOffSelect,btnSendCustom,btnPollNow];
            btns.forEach(b=>b.disabled=!connected);
            slaveAddrInput.disabled=connected;
            baudSelect.disabled=connected;
            if(!connected){ btnYkExecute.disabled=true; ykSelected=null; ykStatus.textContent='就绪'; stopPolling(); }
        }

        // ---------- 事件绑定 ----------
        btnConnect.addEventListener('click',connect);
        btnDisconnect.addEventListener('click',disconnect);
        btnReadStatus.addEventListener('click',readStatusAndSOE);
        btnReadYC.addEventListener('click',requestYC);
        btnReadEnergy.addEventListener('click',requestEnergy);
        btnReadSOE.addEventListener('click',requestSOE);
        btnSetTime.addEventListener('click',requestSetTime);
        btnReset.addEventListener('click',requestReset);
        btnYkOnSelect.addEventListener('click',()=>ykSelect('on'));
        btnYkOffSelect.addEventListener('click',()=>ykSelect('off'));
        btnYkExecute.addEventListener('click',ykExecute);
        btnSendCustom.addEventListener('click',sendCustom);
        btnPollNow.addEventListener('click',pollNow);
        btnClearLog.addEventListener('click',()=>{ logArea.innerHTML=''; });
        btnClearSOE.addEventListener('click',clearSOE);
        btnAutoScroll.addEventListener('click',()=>{ autoScroll=!autoScroll; btnAutoScroll.style.borderColor=autoScroll?'#2ecc71':'#aaa'; btnAutoScroll.style.color=autoScroll?'#2ecc71':'#888'; });
        btnEditNames.addEventListener('click',openNameEditor);
        btnSaveNames.addEventListener('click',saveNames);
        btnCloseNames.addEventListener('click',()=>nameModal.classList.remove('active'));
        btnExportSOE.addEventListener('click',exportSOE);
        btnImportSOE.addEventListener('click',importSOE);
        autoPollCheck.addEventListener('change',()=>{ if(autoPollCheck.checked) startPolling(); else stopPolling(); });
        customFrameInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') sendCustom(); });
        nameModal.addEventListener('click',(e)=>{ if(e.target===nameModal) nameModal.classList.remove('active'); });

        // MQTT 事件
        btnMqttConnect.addEventListener('click', mqttConnect);
        btnMqttDisconnect.addEventListener('click', mqttDisconnect);
        btnMqttPublishNow.addEventListener('click', () => { publishData(); showToast('已发布当前数据', 'info'); });

        // ---------- 初始化 ----------
        updateUI(false);
        renderParse();
        renderSOE();
        log('🚀 ST280G Modbus + MQTT 远程工具已加载','log-info');
        log('💡 每条收发报文都会自动解析含义','log-info');
        log('💡 SOE事件支持 导出TXT / 导入TXT', 'log-info');
        log('🌐 MQTT 默认使用中国区 Broker: wss://broker.emqx.io:8084/mqtt', 'log-info');
        if(!('serial' in navigator)) logErr('⚠️ 当前浏览器不支持 Web Serial API，请使用 Chrome/Edge');
        customFrameInput.value='01 03 00 00 00 06';

        // 暴露调试对象
        window.__debug = { connect, disconnect, requestStatus, requestSOE, requestYC, requestEnergy, requestSetTime, requestReset, ykSelect, ykExecute, sendCustom, pollNow, yxValues, ycValues, pointNames, soeEvents, exportSOE, importSOE, clearSOE, mqttConnect, mqttDisconnect, publishData };
    })();
</script>
</body>
</html>
